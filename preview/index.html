has a purpose.`,ideaStatement:`A speaker designed around leveled listening.`,ideaBody:`Leveled listening is sound designed for gathering on the floor. Inspired by floor-sitting cultures, it brings people together at the same height, encouraging a sense of equality and inviting everyone to relax, connect, and listen together. Designed around this shared position, the speaker invites a natural, whole-body experience of sound.

Each driver has its own enclosure and its own place in the form. This modular approach is intended to limit shared cabinet resonances and unwanted interaction, while giving each part individual attention.

理由がある。`,ideaStatement:`同じ目線で聴くためのスピーカー。`,ideaBody:`Leveled listeningは、床に集まって聴くための音のあり方です。床に座る文化に着想を得て、同じ高さで過ごすことが対等な関係を育み、くつろぎながら語らい、音を分かち合う時間へとつながります。その共通の姿勢を軸に、体全体で自然に音を感じられるスピーカーを目指しました。
